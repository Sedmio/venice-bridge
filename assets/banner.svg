<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="venice-bridge: use your venice.ai web subscription from OpenCode">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#161329"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- left: wordmark, tagline, command chip -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
    <text x="64" y="104" font-size="15" font-weight="600" letter-spacing="3" fill="#a78bfa">OPEN SOURCE  /  LOCAL BRIDGE</text>
    <text x="64" y="176" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#word)">venice-bridge</text>
    <text x="66" y="218" font-size="23" fill="#cbd5e1">Use your venice.ai web subscription</text>
    <text x="66" y="248" font-size="23" fill="#cbd5e1">from OpenCode</text>
  </g>
  <rect x="64" y="272" width="342" height="46" rx="12" fill="#1c1838" stroke="#8b5cf6" stroke-opacity="0.55" stroke-width="1.5"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20">
    <text x="84" y="302" fill="#8b5cf6" font-weight="700">$</text>
    <text x="106" y="302" fill="#ede9fe">python3 venice_bridge.py</text>
  </g>

  <!-- right: terminal card -->
  <rect x="688" y="40" width="544" height="280" rx="14" fill="#0a0d16" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M688 54 a14 14 0 0 1 14 -14 h516 a14 14 0 0 1 14 14 v28 h-544 z" fill="#171a2b"/>
  <circle cx="714" cy="61" r="6" fill="#ff5f57"/>
  <circle cx="734" cy="61" r="6" fill="#febc2e"/>
  <circle cx="754" cy="61" r="6" fill="#28c840"/>
  <text x="960" y="66" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#6b7280">venice-bridge</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13.5" xml:space="preserve">
    <text x="712" y="124"><tspan fill="#8b5cf6" font-weight="700">$</tspan><tspan fill="#ede9fe"> curl -s 127.0.0.1:18891/health</tspan></text>
    <text x="712" y="154" fill="#cbd5e1">{"ok": true, "venice_session": "active",</text>
    <text x="712" y="176" fill="#cbd5e1"> "chat_quota": {"remaining": 9834}}</text>
    <text x="712" y="230"><tspan fill="#8b5cf6" font-weight="700">$</tspan><tspan fill="#ede9fe"> opencode -m venice-bridge/deepseek-v4-1-flash-uncensored</tspan></text>
    <rect x="712" y="252" width="9" height="17" fill="#8b5cf6" opacity="0.85"/>
  </g>
</svg>
